<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan & EMI Calculator</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 40px; background-color: #f4f6f9; }
        .calculator { max-width: 420px; margin: auto; padding: 25px; background: white; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        h2 { text-align: center; color: #2c3e50; margin-bottom: 20px; }
        label { display: block; margin-top: 15px; font-weight: bold; color: #34495e; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; }
        button { width: 100%; padding: 12px; background: #007bff; color: white; border: none; margin-top: 20px; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        button:hover { background: #0056b3; }
        .result { margin-top: 25px; padding: 15px; background: #e9ecef; border-radius: 5px; border-left: 5px solid #007bff; }
        .result p { margin: 8px 0; font-size: 16px; }
    </style>
</head>
<body>

<div class="calculator">
    <h2>🏦 Loan & EMI Calculator</h2>
    
    <label for="principal">Loan Principal Amount (₹):</label>
    <input type="number" id="principal" value="100000" placeholder="e.g. 100000">

    <label for="rate">Annual Interest Rate (%):</label>
    <input type="number" id="rate" step="0.1" value="8.5" placeholder="e.g. 8.5">

    <label for="years">Tenure (in Years):</label>
    <input type="number" id="years" value="2" placeholder="e.g. 2">

    <button onclick="calculateEMI()">Calculate Loan Repayment</button>

    <div class="result" id="output" style="display:none;">
        <p><strong>Monthly EMI:</strong> ₹<span id="emi"></span></p>
        <p><strong>Total Interest Payable:</strong> ₹<span id="interest"></span></p>
        <p><strong>Total Amount Payable:</strong> ₹<span id="total"></span></p>
    </div>
</div>

<script>
function calculateEMI() {
    let P = parseFloat(document.getElementById('principal').value);
    let annualRate = parseFloat(document.getElementById('rate').value);
    let N = parseFloat(document.getElementById('years').value) * 12;
    
    if (isNaN(P) || isNaN(annualRate) || isNaN(N) || P <= 0 || annualRate <= 0 || N <= 0) {
        alert("Please enter valid positive numbers for all fields.");
        return;
    }

    let r = annualRate / (12 * 100);

    // Reducing Balance EMI Formula
    let emi = (P * r * Math.pow(1 + r, N)) / (Math.pow(1 + r, N) - 1);
    let totalPayable = emi * N;
    let totalInterest = totalPayable - P;

    document.getElementById('emi').innerText = emi.toLocaleString('en-IN', {maximumFractionDigits: 2});
    document.getElementById('interest').innerText = totalInterest.toLocaleString('en-IN', {maximumFractionDigits: 2});
    document.getElementById('total').innerText = totalPayable.toLocaleString('en-IN', {maximumFractionDigits: 2});
    document.getElementById('output').style.display = 'block';
}
</script>

</body>
</html>
